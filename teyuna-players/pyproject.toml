[project]
name = "teyuna-players"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sebastian Rodriguez Colina", email = "srcolinas@gmail.com" }
]
requires-python = ">=3.14.6"
dependencies = [
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "pydantic>=2.13.4",
]

[project.scripts]
teyuna-players = "teyuna_players.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.15.22",
]
