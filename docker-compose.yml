services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        UV_VERSION: ${UV_VERSION:-0.11.26}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12.13}
        PYTHON_MINOR: ${PYTHON_MINOR:-3.12}
    env_file:
      - path: .env
        required: false
    environment:
      # One-third of backend Settings defaults for faster simulated games.
      TEYUNA_LOBBY_TIMEOUT: PT20S
      TEYUNA_FIRST_PLACEMENT_TIMEOUT: PT10S
      TEYUNA_SECOND_PLACEMENT_TIMEOUT: PT10S
      TEYUNA_DICE_ROLL_TIMEOUT: PT10S
      TEYUNA_DISCARD_RESOURCES_TIMEOUT: PT15S
      TEYUNA_MOVE_CONQUISTATOR_TIMEOUT: PT10S
      TEYUNA_DICE_PLAY_WARRIOR_TIMEOUT: PT10S
      TEYUNA_DICE_PLAY_MAMO_TIMEOUT: PT10S
      TEYUNA_DICE_PLAY_BLESSED_TIMEOUT: PT10S
      TEYUNA_DICE_PLAY_PATHFINDER_TIMEOUT: PT10S
      TEYUNA_TRADE_AND_BUILD_TIMEOUT: PT30S
      TEYUNA_TRADE_AND_BUILD_PLAY_WARRIOR_TIMEOUT: PT10S
      TEYUNA_TRADE_AND_BUILD_PLAY_MAMO_TIMEOUT: PT10S
      TEYUNA_TRADE_AND_BUILD_PLAY_BLESSED_TIMEOUT: PT10S
      TEYUNA_TRADE_AND_BUILD_PLAY_PATHFINDER_TIMEOUT: PT10S
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
