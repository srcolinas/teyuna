<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 390" width="440" height="390" role="img" aria-labelledby="title desc">
  <title id="title">Board axial coordinates</title>
  <desc id="desc">Nineteen touching hexagons labeled q,r. The r=0 axis runs horizontally from left to right, and the q=0 axis runs from top-left to bottom-right.</desc>
  <style>
    .hex { fill: #f4f0e8; stroke: #3d3a34; stroke-width: 1.5; }
    .center { fill: #e8e2d6; }
    .axis { fill: none; stroke-width: 3; stroke-linecap: round; opacity: .55; }
    .q-axis { stroke: #2563eb; }
    .r-axis { stroke: #b45309; }
    .label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; fill: #1a1a1a; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: #f4f0e8; stroke-width: 4px; }
    .axis-label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; }
    .caption { font-family: system-ui, sans-serif; font-size: 12px; fill: #4b453d; text-anchor: middle; }
  </style>
  <defs>
    <polygon id="hex" points="0,-42 36.373,-21 36.373,21 0,42 -36.373,21 -36.373,-21"/>
  </defs>

  <!-- Pointy-top centers use x = √3·size·(q + r/2), y = 3/2·size·r.
       Therefore all neighboring hexagons share a complete edge. -->
  <use href="#hex" class="hex" transform="translate(137.254 54)"/>
  <use href="#hex" class="hex" transform="translate(210 54)"/>
  <use href="#hex" class="hex" transform="translate(282.746 54)"/>

  <use href="#hex" class="hex" transform="translate(100.881 117)"/>
  <use href="#hex" class="hex" transform="translate(173.627 117)"/>
  <use href="#hex" class="hex" transform="translate(246.373 117)"/>
  <use href="#hex" class="hex" transform="translate(319.119 117)"/>

  <use href="#hex" class="hex" transform="translate(64.508 180)"/>
  <use href="#hex" class="hex" transform="translate(137.254 180)"/>
  <use href="#hex" class="hex center" transform="translate(210 180)"/>
  <use href="#hex" class="hex" transform="translate(282.746 180)"/>
  <use href="#hex" class="hex" transform="translate(355.492 180)"/>

  <use href="#hex" class="hex" transform="translate(100.881 243)"/>
  <use href="#hex" class="hex" transform="translate(173.627 243)"/>
  <use href="#hex" class="hex" transform="translate(246.373 243)"/>
  <use href="#hex" class="hex" transform="translate(319.119 243)"/>

  <use href="#hex" class="hex" transform="translate(137.254 306)"/>
  <use href="#hex" class="hex" transform="translate(210 306)"/>
  <use href="#hex" class="hex" transform="translate(282.746 306)"/>

  <!-- Coordinate zero-lines requested in the API descriptions. -->
  <line class="axis r-axis" x1="64.508" y1="180" x2="355.492" y2="180"/>
  <line class="axis q-axis" x1="137.254" y1="54" x2="282.746" y2="306"/>

  <text class="label" x="137.254" y="54">0,-2</text>
  <text class="label" x="210" y="54">1,-2</text>
  <text class="label" x="282.746" y="54">2,-2</text>

  <text class="label" x="100.881" y="117">-1,-1</text>
  <text class="label" x="173.627" y="117">0,-1</text>
  <text class="label" x="246.373" y="117">1,-1</text>
  <text class="label" x="319.119" y="117">2,-1</text>

  <text class="label" x="64.508" y="180">-2,0</text>
  <text class="label" x="137.254" y="180">-1,0</text>
  <text class="label" x="210" y="180">0,0</text>
  <text class="label" x="282.746" y="180">1,0</text>
  <text class="label" x="355.492" y="180">2,0</text>

  <text class="label" x="100.881" y="243">-2,1</text>
  <text class="label" x="173.627" y="243">-1,1</text>
  <text class="label" x="246.373" y="243">0,1</text>
  <text class="label" x="319.119" y="243">1,1</text>

  <text class="label" x="137.254" y="306">-2,2</text>
  <text class="label" x="210" y="306">-1,2</text>
  <text class="label" x="282.746" y="306">0,2</text>

  <text class="axis-label" x="372" y="185" fill="#b45309">r = 0</text>
  <text class="axis-label" x="292" y="323" fill="#2563eb">q = 0</text>
  <text class="caption" x="220" y="365">
    <tspan fill="#b45309" font-weight="700">r = 0</tspan>
    <tspan> is horizontal; </tspan>
    <tspan fill="#2563eb" font-weight="700">q = 0</tspan>
    <tspan> runs top-left to bottom-right.</tspan>
  </text>
</svg>
