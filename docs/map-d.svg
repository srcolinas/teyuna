<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Direction d on a hex</title>
  <desc id="desc">A single pointy-top hexagon with vertex directions 0-5 at corners and edge directions 0-5 on sides, numbered clockwise from the top.</desc>
  <style>
    .hex { fill: #f4f0e8; stroke: #3d3a34; stroke-width: 2.5; }
    .edge-mark { stroke: #2f6f5e; stroke-width: 4; stroke-linecap: round; }
    .v-dot { fill: #b45309; stroke: #7c3a0a; stroke-width: 1.5; }
    .v-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; font-weight: 700; fill: #b45309; text-anchor: middle; dominant-baseline: central; }
    .e-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; font-weight: 700; fill: #2f6f5e; text-anchor: middle; dominant-baseline: central; }
    .legend { font-family: system-ui, sans-serif; font-size: 13px; fill: #3d3a34; }
    .legend-title { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #1a1a1a; }
    .swatch-v { fill: #b45309; }
    .swatch-e { stroke: #2f6f5e; stroke-width: 4; stroke-linecap: round; }
  </style>
  <polygon class="hex" points="200.0,60.0 286.6,110.0 286.6,210.0 200.0,260.0 113.4,210.0 113.4,110.0"/>
  <line class="edge-mark" x1="224.2" y1="74.0" x2="262.4" y2="96.0"/>
  <line class="edge-mark" x1="286.6" y1="138.0" x2="286.6" y2="182.0"/>
  <line class="edge-mark" x1="262.4" y1="224.0" x2="224.2" y2="246.0"/>
  <line class="edge-mark" x1="175.8" y1="246.0" x2="137.6" y2="224.0"/>
  <line class="edge-mark" x1="113.4" y1="182.0" x2="113.4" y2="138.0"/>
  <line class="edge-mark" x1="137.6" y1="96.0" x2="175.8" y2="74.0"/>
  <circle class="v-dot" cx="200.0" cy="60.0" r="7"/>
  <text class="v-label" x="200.0" y="38.0">0</text>
  <circle class="v-dot" cx="286.6" cy="110.0" r="7"/>
  <text class="v-label" x="305.7" y="99.0">1</text>
  <circle class="v-dot" cx="286.6" cy="210.0" r="7"/>
  <text class="v-label" x="305.7" y="221.0">2</text>
  <circle class="v-dot" cx="200.0" cy="260.0" r="7"/>
  <text class="v-label" x="200.0" y="282.0">3</text>
  <circle class="v-dot" cx="113.4" cy="210.0" r="7"/>
  <text class="v-label" x="94.3" y="221.0">4</text>
  <circle class="v-dot" cx="113.4" cy="110.0" r="7"/>
  <text class="v-label" x="94.3" y="99.0">5</text>
  <text class="e-label" x="255.4" y="64.0">0</text>
  <text class="e-label" x="310.9" y="160.0">1</text>
  <text class="e-label" x="255.4" y="256.0">2</text>
  <text class="e-label" x="144.6" y="256.0">3</text>
  <text class="e-label" x="89.1" y="160.0">4</text>
  <text class="e-label" x="144.6" y="64.0">5</text>
  <circle class="v-dot" cx="34" cy="302" r="6"/>
  <text class="legend" x="50" y="306"><tspan class="legend-title" fill="#b45309">Vertex d</tspan> — terrace corner.</text>
  <text class="legend" x="50" y="323">d=0 at the top, then clockwise.</text>
  <line class="swatch-e" x1="22" y1="352" x2="46" y2="352"/>
  <text class="legend" x="50" y="356"><tspan class="legend-title" fill="#2f6f5e">Edge d</tspan> — path side.</text>
  <text class="legend" x="50" y="373">d=0 is the top-right side, between</text>
  <text class="legend" x="50" y="390">vertices 0 and 1, then clockwise.</text>
</svg>
