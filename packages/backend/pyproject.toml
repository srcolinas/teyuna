[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "annotated-types>=0.7.0",
    "fastapi>=0.135.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pytest-asyncio>=1.4.0",
    "teyuna-core",
    "uvicorn>=0.51.0",
]

[tool.uv]
package = false

[tool.uv.sources]
teyuna-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: marks tests that are slow"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "mypy>=1.19.1",
    "pre-commit>=4.2.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-rerunfailures>=16.4",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.10",
]
