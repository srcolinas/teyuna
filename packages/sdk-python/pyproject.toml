[project]
name = "teyuna-sdk"
version = "0.1.0"
description = "Python SDK for building AI agents and clients for the Teyuna board game"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sebastian Rodriguez Colina", email = "srcolinas@gmail.com" },
]
maintainers = [
    { name = "Sebastian Rodriguez Colina", email = "srcolinas@gmail.com" },
]
requires-python = ">=3.14"
keywords = [
    "teyuna",
    "board-game",
    "sdk",
    "game-ai",
    "agents",
    "async",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Board Games",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.5.0",
    "pydantic>=2.13.4",
    "teyuna-core",
]

[tool.uv.sources]
teyuna-core = { workspace = true }

[project.scripts]
teyuna-simulate = "teyuna_sdk.cli:main"

[project.urls]
Homepage = "https://github.com/srcolinas/teyuna"
Repository = "https://github.com/srcolinas/teyuna"
Documentation = "https://github.com/srcolinas/teyuna/tree/main/packages/sdk-python"
Issues = "https://github.com/srcolinas/teyuna/issues"
Changelog = "https://github.com/srcolinas/teyuna/releases"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.0.2",
    "ruff>=0.15.22",
]
